<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Userbot Manager</title>
<meta name="theme-color" content="#0d1320">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{--bg1:#0d1320;--bg2:#070a12;--accent:#34e0a1;--accent2:#1f8fff;--txt:#f1f4fa;--muted:#8d9bb5;
    --glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.085);--line:rgba(255,255,255,.1)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{height:100%}
  button{font:inherit;color:inherit;border:0;background:none;text-align:left}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;color:var(--txt);
    background:linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed;min-height:100vh;overflow-x:hidden;
    padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  .glow{position:fixed;border-radius:50%;filter:blur(90px);opacity:.38;z-index:0;pointer-events:none}
  .glow.a{width:320px;height:320px;background:var(--accent);top:-140px;left:-100px;animation:f1 16s ease-in-out infinite}
  .glow.b{width:280px;height:280px;background:var(--accent2);top:120px;right:-130px;animation:f2 20s ease-in-out infinite}
  body.noanim .glow{animation:none}
  @keyframes f1{50%{transform:translate(40px,50px)}} @keyframes f2{50%{transform:translate(-40px,40px)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .app{position:relative;z-index:1}
  .rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
  .top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
    background:linear-gradient(180deg,var(--bg1) 30%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .logo{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .bn{font-size:15px;font-weight:800;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bs{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:1px}
  .bs i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(52,224,161,.18)}
  .ibtn{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:var(--glass);border:1px solid var(--line);transition:transform .15s}
  .ibtn:active{transform:scale(.9)}
  .wrap{padding:6px 16px 0;max-width:560px;margin:0 auto}
  .glass,.tile,.plan{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .usercard{padding:18px;border-radius:24px;display:flex;align-items:center;gap:15px;box-shadow:0 10px 36px rgba(0,0,0,.28);
    background:linear-gradient(135deg,rgba(255,255,255,.085),rgba(255,255,255,.025))}
  .avatar{width:58px;height:58px;border-radius:19px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;
    color:#06140d;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 0 3px rgba(255,255,255,.07),0 8px 22px rgba(0,0,0,.35)}
  .uinfo{flex:1;min-width:0}
  .uinfo .h{font-size:17px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .uinfo .s{font-size:12px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
  .rbadge{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:11px;font-weight:800;padding:5px 12px;border-radius:99px;
    background:rgba(52,224,161,.14);color:var(--accent);border:1px solid rgba(52,224,161,.3)}
  .cta{display:flex;align-items:center;gap:14px;width:100%;margin-top:14px;padding:18px;border-radius:22px;cursor:pointer;color:#04130c;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 14px 34px rgba(0,0,0,.35);transition:transform .15s}
  .cta:active{transform:scale(.97)}
  .cta .ic{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(255,255,255,.28)}
  .cta .tx{flex:1}.cta .t{font-weight:800;font-size:15px}.cta .d{font-size:12px;opacity:.75;margin-top:2px;line-height:1.4}
  .cta .go{font-size:20px;font-weight:800}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .tile{padding:16px;border-radius:22px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:12px;min-height:128px;
    transition:transform .15s,border-color .15s}
  .tile:active{transform:scale(.96);border-color:var(--accent)}
  .tile .ic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;
    background:hsla(var(--h,160),80%,60%,.16);border:1px solid hsla(var(--h,160),80%,65%,.25)}
  .tile .t{font-weight:800;font-size:14.5px}.tile .d{color:var(--muted);font-size:11.5px;line-height:1.45;margin-top:3px}
  .tile .arrow{position:absolute;top:16px;right:16px;opacity:.35;font-size:18px}
  .tile.full{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center}
  .tile.full .arrow{top:50%;transform:translateY(-50%)}
  .foot{text-align:center;color:var(--muted);font-size:11px;margin-top:26px;line-height:1.7}.foot b{color:var(--accent)}
  .overlay{position:fixed;inset:0;background:rgba(3,6,12,.62);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:.25s;z-index:70}
  .overlay.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;max-width:560px;margin:0 auto;background:linear-gradient(180deg,#151e2f,#0b0f17);
    border-radius:30px 30px 0 0;border:1px solid var(--line);border-bottom:0;padding:14px 18px calc(28px + env(safe-area-inset-bottom));
    transform:translateY(110%);transition:transform .32s cubic-bezier(.2,.85,.25,1);max-height:88vh;overflow-y:auto;overscroll-behavior:contain;box-shadow:0 -16px 50px rgba(0,0,0,.55)}
  .sheet.show{transform:none}
  .grab{width:40px;height:5px;background:rgba(255,255,255,.18);border-radius:3px;margin:0 auto 16px}
  .sheet h2{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px}
  .sheet .lead{color:var(--muted);font-size:13px;line-height:1.65;margin-bottom:6px}
  .sec-title{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
  .plan{border-radius:20px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
  .plan.hot{border-color:rgba(52,224,161,.5);background:linear-gradient(135deg,rgba(52,224,161,.12),rgba(31,143,255,.06))}
  .plan .pop{position:absolute;top:0;right:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04130c;font-size:10px;font-weight:800;padding:5px 13px;border-radius:0 20px 0 14px}
  .plan .pname{font-size:16px;font-weight:800}.plan .pdesc{font-size:12px;color:var(--muted);margin:5px 0 13px;line-height:1.5}
  .price-row{display:flex;gap:10px}
  .pcell{flex:1;background:var(--glass2);border:1px solid var(--line);border-radius:15px;padding:11px;text-align:center}
  .pcell .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .pcell .val{font-size:18px;font-weight:800;margin-top:3px;letter-spacing:-.3px}
  .row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}
  .row:last-child{border-bottom:0}.row .v{margin-left:auto;font-weight:700;color:var(--accent);font-size:13px}
  .cat{display:inline-block;background:var(--glass2);border:1px solid var(--line);padding:7px 13px;border-radius:99px;font-size:12px;margin:0 6px 8px 0}
  .btn{display:block;width:100%;text-align:center;padding:15px;border-radius:16px;border:0;cursor:pointer;font-weight:800;font-size:15px;margin-top:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04130c;transition:transform .15s}
  .btn:active{transform:scale(.97)}.btn.sec{background:var(--glass2);color:var(--txt);border:1px solid var(--line)}
  .swatches{display:flex;gap:12px;flex-wrap:wrap}
  .sw{width:54px;text-align:center;cursor:pointer}
  .sw .dot{width:48px;height:48px;border-radius:15px;border:2px solid transparent;transition:.15s;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  .sw.active .dot{border-color:#fff;transform:scale(1.07)}.sw .nm{font-size:10px;color:var(--muted);margin-top:5px}
  .picker-row{display:flex;gap:12px;margin-top:6px}.pick{flex:1}
  .pick label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
  .pick input[type=color]{width:100%;height:46px;border:1px solid var(--line);border-radius:14px;background:var(--glass2);cursor:pointer;padding:4px}
  .preview{height:54px;border-radius:16px;margin-top:12px;border:1px solid var(--line)}
  .toggle{display:flex;align-items:center;gap:10px;padding:13px 0;font-size:14px}
  .sw-toggle{margin-left:auto;width:48px;height:28px;border-radius:20px;background:var(--glass2);border:1px solid var(--line);position:relative;transition:.2s;cursor:pointer}
  .sw-toggle .knob{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#8d9bb5;transition:.2s}
  .sw-toggle.on{background:linear-gradient(135deg,var(--accent),var(--accent2))}.sw-toggle.on .knob{left:22px;background:#fff}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="app">
    <header class="top">
      <div class="brand"><div class="logo">🤖</div><div><div class="bn" id="botName">USERBOT MANAGER</div><div class="bs"><i></i>Premium Userbot Service</div></div></div>
      <button class="ibtn" id="fab" aria-label="Pengaturan"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
    </header>
    <div class="wrap">
      <section class="usercard glass rise" style="--i:0">
        <div class="avatar" id="avatar">U</div>
        <div class="uinfo"><div class="h" id="hello">Halo</div><div class="s" id="uid">ID: -</div><span class="rbadge" id="roleBadge">Owner</span></div>
      </section>
      <button class="cta tile-cta rise" style="--i:1" data-act="connect"><span class="ic">🤖</span><span class="tx"><div class="t">Buat / Sambungkan Userbot</div><div class="d">Aktifkan ubot lewat nomor + OTP atau API sendiri</div></span><span class="go">→</span></button>
      <div class="grid">
        <button class="tile rise" style="--i:2;--h:160" data-tab="beli"><span class="arrow">›</span><div class="ic">💎</div><div><div class="t">Beli Akses</div><div class="d">Premium sampai Ceo</div></div></button>
        <button class="tile rise" style="--i:3;--h:45" data-tab="upgrade"><span class="arrow">›</span><div class="ic">⚡</div><div><div class="t">Role System</div><div class="d">Jenjang &amp; benefit</div></div></button>
        <button class="tile rise" style="--i:4;--h:210" data-tab="help"><span class="arrow">›</span><div class="ic">📖</div><div><div class="t">Help Menu</div><div class="d">Ratusan command</div></div></button>
        <button class="tile rise" style="--i:5;--h:280" data-tab="group"><span class="arrow">›</span><div class="ic">👥</div><div><div class="t">Group Ubot</div><div class="d">Komunitas &amp; info</div></div></button>
        <button class="tile full rise" style="--i:6;--h:0;gap:14px" data-tab="support"><span class="arrow">›</span><div class="ic">🛟</div><div><div class="t">Support</div><div class="d">Hubungi owner kalau ada kendala</div></div></button>
      </div>
      <div class="foot" id="foot">UBot Manager</div>
    </div>
  </div>
  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<script>
  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  try { tg.ready(); tg.expand(); } catch(e){}
  function haptic(t){ try{ tg.HapticFeedback.impactOccurred(t||"light"); }catch(e){} }

  var q = new URLSearchParams(location.search);
  function dec(k, def){ try{ var v=q.get(k); return v!==null ? decodeURIComponent(v) : (def||""); }catch(e){ return q.get(k)||def||""; } }
  var tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : {};
  var name = dec("name", tgUser.first_name || "Kak");
  var role = (dec("role","user") || "user").toLowerCase();
  var uid  = dec("uid", tgUser.id ? String(tgUser.id) : "-");
  var owners = dec("owners","@dimazgwcadangan1").split(",").map(function(s){return s.trim();}).filter(Boolean);
  var botName = dec("bot","@Userbot_Forgot_bot");

  var roleMap = {
    pemilik:["Pemilik","#34e0a1","💎"], ceo:["Ceo","#ffd54a","🌟"], tk:["Tk","#4ad7ff","🔱"],
    owner:["Owner","#f5b942","👑"], admin:["Admin","#ff6b6b","🛡️"],
    reseller:["Reseller","#a695e7","💼"], prem:["Premium","#34e0a1","💎"],
    premium:["Premium","#34e0a1","💎"], user:["User","#8a9bb6","👤"]
  };
  var rm = roleMap[role] || roleMap.user;
  document.getElementById("botName").textContent = (botName.replace("@","")||"USERBOT").toUpperCase() + " MANAGER";
  document.getElementById("hello").textContent = "Halo, " + name + " 👋";
  document.getElementById("uid").textContent = "ID: " + uid;
  document.getElementById("avatar").textContent = ((name.trim()[0]) || "U").toUpperCase();
  var rb = document.getElementById("roleBadge");
  rb.textContent = rm[2] + " " + rm[0]; rb.style.color = rm[1];
  rb.style.borderColor = rm[1] + "55"; rb.style.background = rm[1] + "22";
  document.getElementById("foot").innerHTML = botName + " &bull; <b>Mini App</b>";

  var PRESETS = [
    {nm:"Midnight", bg1:"#0d1320", bg2:"#070a12", accent:"#34e0a1", accent2:"#1f8fff"},
    {nm:"Ocean",    bg1:"#081a2c", bg2:"#040d18", accent:"#1f8fff", accent2:"#00e0d4"},
    {nm:"Emerald",  bg1:"#07160f", bg2:"#030d08", accent:"#27c46b", accent2:"#00e0a0"},
    {nm:"Royal",    bg1:"#150f2c", bg2:"#0a0718", accent:"#a695e7", accent2:"#6c5ce7"},
    {nm:"Sunset",   bg1:"#22110b", bg2:"#140705", accent:"#ff8a5b", accent2:"#f0941e"},
    {nm:"Rose",     bg1:"#220b16", bg2:"#14050d", accent:"#ff6b9d", accent2:"#ff4757"},
    {nm:"Mono",     bg1:"#16191d", bg2:"#0b0d0f", accent:"#d9dee6", accent2:"#9aa3ad"}
  ];
  var DEF = { bg1:"#0d1320", bg2:"#070a12", accent:"#34e0a1", accent2:"#1f8fff", anim:true };
  var prefs = {}; for(var k0 in DEF) prefs[k0]=DEF[k0];
  try { var saved = JSON.parse(localStorage.getItem("ubotMiniTheme")||"null"); if(saved){ for(var k in saved) prefs[k]=saved[k]; } } catch(e){}

  function applyTheme(){
    var r = document.documentElement.style;
    r.setProperty("--bg1", prefs.bg1); r.setProperty("--bg2", prefs.bg2);
    r.setProperty("--accent", prefs.accent); r.setProperty("--accent2", prefs.accent2);
    document.body.classList.toggle("noanim", !prefs.anim);
    try { tg.setBackgroundColor && tg.setBackgroundColor(prefs.bg2); tg.setHeaderColor && tg.setHeaderColor(prefs.bg1); } catch(e){}
  }
  function saveTheme(){ try{ localStorage.setItem("ubotMiniTheme", JSON.stringify(prefs)); }catch(e){} }
  applyTheme();

  function openOwner(){
    var u = (owners[0]||"").replace("@","");
    if(u){ try{ tg.openTelegramLink("https://t.me/"+u); }catch(e){ location.href="https://t.me/"+u; } }
  }

  var overlay = document.getElementById("overlay");
  var sheet = document.getElementById("sheet");
  var body = document.getElementById("sheetBody");
  function showSheet(html){ body.innerHTML = html; overlay.classList.add("show"); sheet.classList.add("show"); haptic("light"); bindSheet(); }
  function closeSheet(){ overlay.classList.remove("show"); sheet.classList.remove("show"); }
  overlay.onclick = closeSheet;

  function planHtml(nameP, desc, p30, pPerm, hot){
    return '<div class="plan' + (hot?' hot':'') + '">' +
      (hot?'<span class="pop">POPULER</span>':'') +
      '<div class="pname">' + nameP + '</div>' +
      '<div class="pdesc">' + desc + '</div>' +
      '<div class="price-row">' +
        '<div class="pcell"><div class="lbl">30 Hari</div><div class="val">Rp' + p30 + '</div></div>' +
        '<div class="pcell"><div class="lbl">Permanen</div><div class="val">Rp' + pPerm + '</div></div>' +
      '</div></div>';
  }
  function tabBeli(){
    var h = '<h2>💎 Beli Akses</h2>' +
      '<div class="lead">Pilih paket sesuai kebutuhan. Transaksi masih manual — order langsung ke owner.</div>' +
      '<div class="sec-title">Daftar Harga</div>' +
      planHtml("💎 Premium", "Akses semua ratusan command, 1 userbot pribadi.", "1.000", "2.000", true) +
      planHtml("💼 Reseller", "Bisa jual akses Premium ke orang lain.", "3.000", "4.000", false) +
      planHtml("🛡️ Admin", "Bisa tambah Reseller & Premium.", "5.000", "7.000", false) +
      planHtml("👑 Owner", "Bisa tambah Admin, Reseller & Premium.", "8.000", "10.000", false) +
      planHtml("🔱 Tk", "Bisa tambah Owner ke bawah.", "11.000", "12.000", false) +
      planHtml("🌟 Ceo", "Role tertinggi yang dijual — tambah Tk ke bawah.", "13.000", "15.000", false) +
      '<button class="btn" data-do="owner">💬 Order ke Owner</button>' +
      '<button class="btn sec" data-do="close">Tutup</button>';
    showSheet(h);
  }
  function tabUpgrade(){
    var h = '<h2>⚡ Role System</h2>' +
      '<div class="lead">Sistem role berjenjang — makin tinggi, makin banyak yang bisa kamu tambah.</div>' +
      '<div class="row"><span>💎 Pemilik</span><span class="v">Kuasa penuh</span></div>' +
      '<div class="row"><span>🌟 Ceo</span><span class="v">Add Tk ke bawah</span></div>' +
      '<div class="row"><span>🔱 Tk</span><span class="v">Add Owner ke bawah</span></div>' +
      '<div class="row"><span>👑 Owner</span><span class="v">Add Admin ke bawah</span></div>' +
      '<div class="row"><span>🛡️ Admin</span><span class="v">Add Reseller & Prem</span></div>' +
      '<div class="row"><span>💼 Reseller</span><span class="v">Add Premium</span></div>' +
      '<div class="row"><span>💎 Premium</span><span class="v">Pakai ubot</span></div>' +
      '<div class="lead" style="margin-top:14px">Role kamu sekarang: <b style="color:'+rm[1]+'">'+rm[2]+" "+rm[0]+'</b></div>' +
      '<button class="btn sec" data-do="close">Tutup</button>';
    showSheet(h);
  }
  function tabHelp(){
    var cats = ["Umum","Utilitas","Islami","Tools","Fun","Fonts","Encode","Text","Math","Convert","Generator","Grup","Blacklist","Promosi","Transaksi","Role"];
    var chips=""; for(var i=0;i<cats.length;i++){ chips += '<span class="cat">'+cats[i]+'</span>'; }
    var h = '<h2>📖 Help Menu</h2>' +
      '<div class="lead">Ada <b style="color:var(--accent)">ratusan command</b> di userbot kamu, terbagi dalam kategori:</div>' +
      '<div style="margin:10px 0">' + chips + '</div>' +
      '<div class="lead">Ketik <b>.help</b> di chat userbot untuk menu lengkap + tombol tiap command.</div>' +
      '<button class="btn sec" data-do="close">Tutup</button>';
    showSheet(h);
  }
  function tabGroup(){
    var h = '<h2>👥 Group Ubot</h2>' +
      '<div class="lead">Gabung komunitas untuk update, tutorial & tanya-jawab bareng user lain. Info grup tanya owner ya.</div>' +
      '<button class="btn" data-do="owner">💬 Tanya Owner</button>' +
      '<button class="btn sec" data-do="close">Tutup</button>';
    showSheet(h);
  }
  function tabSupport(){
    var ow=""; for(var i=0;i<owners.length;i++){ ow += '<div class="row"><span>👤 Owner</span><span class="v">'+owners[i]+'</span></div>'; }
    var h = '<h2>🛟 Support</h2>' +
      '<div class="lead">Ada kendala atau pertanyaan? Hubungi owner utama:</div>' + ow +
      '<button class="btn" data-do="owner">💬 Chat Owner</button>' +
      '<button class="btn sec" data-do="close">Tutup</button>';
    showSheet(h);
  }

  function tabSettings(){
    var sw="";
    for(var i=0;i<PRESETS.length;i++){
      var p = PRESETS[i];
      var active = (p.bg1===prefs.bg1 && p.accent===prefs.accent) ? " active" : "";
      sw += '<div class="sw'+active+'" data-preset="'+i+'">' +
        '<div class="dot" style="background:linear-gradient(135deg,'+p.accent+','+p.accent2+')"></div>' +
        '<div class="nm">'+p.nm+'</div></div>';
    }
    var h = '<h2>⚙️ Pengaturan</h2>' +
      '<div class="lead">Ubah tampilan Mini App sesukamu. Tersimpan otomatis di HP kamu.</div>' +
      '<div class="sec-title">Tema</div>' +
      '<div class="swatches">' + sw + '</div>' +
      '<div class="sec-title">Background Custom (Atas → Bawah)</div>' +
      '<div class="picker-row">' +
        '<div class="pick"><label>Warna Atas</label><input type="color" id="bgTop" value="'+prefs.bg1+'"></div>' +
        '<div class="pick"><label>Warna Bawah</label><input type="color" id="bgBot" value="'+prefs.bg2+'"></div>' +
      '</div>' +
      '<div class="preview" id="bgPrev"></div>' +
      '<div class="sec-title">Warna Aksen</div>' +
      '<div class="picker-row">' +
        '<div class="pick"><label>Aksen 1</label><input type="color" id="ac1" value="'+prefs.accent+'"></div>' +
        '<div class="pick"><label>Aksen 2</label><input type="color" id="ac2" value="'+prefs.accent2+'"></div>' +
      '</div>' +
      '<div class="sec-title">Lainnya</div>' +
      '<div class="toggle"><span>Animasi Background</span><div class="sw-toggle'+(prefs.anim?' on':'')+'" id="tgAnim"><div class="knob"></div></div></div>' +
      '<button class="btn" data-do="close">Selesai</button>' +
      '<button class="btn sec" data-do="reset">Reset ke Default</button>';
    showSheet(h);
    updatePrev();
  }
  function updatePrev(){ var pv=document.getElementById("bgPrev"); if(pv) pv.style.background = "linear-gradient(180deg,"+prefs.bg1+","+prefs.bg2+")"; }

  function bindSheet(){
    var btns = body.querySelectorAll("[data-do]");
    for(var i=0;i<btns.length;i++){
      btns[i].onclick = function(){
        var act = this.getAttribute("data-do");
        if(act==="owner") openOwner();
        else if(act==="close") closeSheet();
        else if(act==="reset"){ prefs={}; for(var k in DEF) prefs[k]=DEF[k]; applyTheme(); saveTheme(); tabSettings(); }
      };
    }
    var sws = body.querySelectorAll("[data-preset]");
    for(var j=0;j<sws.length;j++){
      sws[j].onclick = function(){
        var p = PRESETS[parseInt(this.getAttribute("data-preset"))];
        prefs.bg1=p.bg1; prefs.bg2=p.bg2; prefs.accent=p.accent; prefs.accent2=p.accent2;
        applyTheme(); saveTheme(); haptic("light"); tabSettings();
      };
    }
    var bgTop=document.getElementById("bgTop"), bgBot=document.getElementById("bgBot"),
        ac1=document.getElementById("ac1"), ac2=document.getElementById("ac2"), tgAnim=document.getElementById("tgAnim");
    if(bgTop) bgTop.oninput=function(){ prefs.bg1=this.value; applyTheme(); saveTheme(); updatePrev(); };
    if(bgBot) bgBot.oninput=function(){ prefs.bg2=this.value; applyTheme(); saveTheme(); updatePrev(); };
    if(ac1) ac1.oninput=function(){ prefs.accent=this.value; applyTheme(); saveTheme(); };
    if(ac2) ac2.oninput=function(){ prefs.accent2=this.value; applyTheme(); saveTheme(); };
    if(tgAnim) tgAnim.onclick=function(){ prefs.anim=!prefs.anim; this.classList.toggle("on"); applyTheme(); saveTheme(); };
  }

  var TABS = { beli:tabBeli, upgrade:tabUpgrade, help:tabHelp, group:tabGroup, support:tabSupport };
  var tiles = document.querySelectorAll(".tile,.tile-cta");
  for(var i=0;i<tiles.length;i++){
    tiles[i].onclick = function(){
      var tab = this.getAttribute("data-tab");
      var act = this.getAttribute("data-act");
      if(tab && TABS[tab]){ TABS[tab](); return; }
      if(act==="connect"){
        haptic("medium");
        var did=false;
        try { tg.sendData(JSON.stringify({action:"connect"})); did=true; } catch(e){}
        if(!did){
          var u = botName.replace("@","");
          try { tg.openTelegramLink("https://t.me/"+u+"?start=connect"); }
          catch(e){
            try { tg.showAlert("Ketik /connect di chat untuk menyambungkan userbot."); }
            catch(e2){ alert("Ketik /connect di chat untuk menyambungkan userbot."); }
          }
        }
      }
    };
  }
  document.getElementById("fab").onclick = function(){ haptic("light"); tabSettings(); };
</script>
</body>
</html>
